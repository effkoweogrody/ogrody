name: Publikacja strony z panelu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: effkowe-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-cms.txt
      - run: python scripts/build_cms.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_seo.py --origin https://effkoweogrody.pl --output ../public-site --copy-assets --write-cname
      - name: Dodaj wejście do panelu
        run: |
          if [ -d admin ]; then cp -R admin ../public-site/admin; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ../public-site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
